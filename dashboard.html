<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bracelet Buddies — Home</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>

<nav>
  <a href="dashboard.html">Home</a>
  <a href="tutorials.html">Tutorials</a>
  <a href="my-bracelets.html">My Bracelets</a>
  <a href="friends.html">Friends</a>
  <span class="spacer"></span>
  <span id="welcome-msg" style="color:white;"></span>
  <a href="#" onclick="logout()">Log Out</a>
</nav>

<main>
  <h1>Welcome back!</h1>
  <p>Here's what you and your friends have been making lately.</p>
  <div id="friend-feed">Loading...</div>
</main>

<script>
  let currentUser;

  async function init() {
    currentUser = await requireLogin();
    if (!currentUser) return;

    const { data: profile } = await supabase
      .from("profiles")
      .select("username")
      .eq("id", currentUser.id)
      .single();
    document.getElementById("welcome-msg").textContent = "Hi, " + profile.username;

    loadFriendFeed();
  }

  // Shows the most recent bracelet photos from you and your accepted friends
  async function loadFriendFeed() {
    const feedDiv = document.getElementById("friend-feed");

    // Get IDs of accepted friends (in either direction of the friendship row)
    const { data: friendships } = await supabase
      .from("friendships")
      .select("user_id, friend_id")
      .eq("status", "accepted")
      .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`);

    const friendIds = (friendships || []).map(f =>
      f.user_id === currentUser.id ? f.friend_id : f.user_id
    );

    // Include your own posts in the feed too, not just friends'
    const feedUserIds = [...friendIds, currentUser.id];

    const { data: bracelets } = await supabase
      .from("bracelets")
      .select("*, profiles(username)")
      .in("user_id", feedUserIds)
      .order("created_at", { ascending: false })
      .limit(10);

    if (!bracelets || bracelets.length === 0) {
      feedDiv.innerHTML = "<p>No bracelets yet \u2014 post one from My Bracelets, or add friends to see theirs here!</p>";
      return;
    }

    await loadSocialData(bracelets.map(b => b.id));
    feedDiv.innerHTML = bracelets.map(b => renderBraceletCard(b)).join("");
  }

  // ---- Likes and comments ----
  // Loaded in bulk (one query for all likes, one for all comments) rather
  // than per-card, so the feed doesn't fire off dozens of tiny requests.
  let likeCounts = {};   // bracelet_id -> number of likes
  let userLiked = {};    // bracelet_id -> true if currentUser liked it
  let likersByBracelet = {}; // bracelet_id -> array of usernames who liked it
  let commentsByBracelet = {}; // bracelet_id -> array of comment rows

  async function loadSocialData(braceletIds) {
    const { data: likes } = await supabase
      .from("bracelet_likes")
      .select("bracelet_id, user_id, profiles(username)")
      .in("bracelet_id", braceletIds);

    likeCounts = {};
    userLiked = {};
    likersByBracelet = {};
    (likes || []).forEach(like => {
      likeCounts[like.bracelet_id] = (likeCounts[like.bracelet_id] || 0) + 1;
      if (like.user_id === currentUser.id) userLiked[like.bracelet_id] = true;
      if (!likersByBracelet[like.bracelet_id]) likersByBracelet[like.bracelet_id] = [];
      likersByBracelet[like.bracelet_id].push(like.profiles.username);
    });

    const { data: comments } = await supabase
      .from("bracelet_comments")
      .select("*, profiles(username)")
      .in("bracelet_id", braceletIds)
      .order("created_at", { ascending: true });

    commentsByBracelet = {};
    (comments || []).forEach(c => {
      if (!commentsByBracelet[c.bracelet_id]) commentsByBracelet[c.bracelet_id] = [];
      commentsByBracelet[c.bracelet_id].push(c);
    });
  }

  function renderBraceletCard(b) {
    const liked = !!userLiked[b.id];
    const count = likeCounts[b.id] || 0;
    const comments = commentsByBracelet[b.id] || [];

    return `
      <div class="card">
        <img src="${b.photo_url}" alt="bracelet photo">
        <strong>${b.profiles.username}</strong>
        <p>${b.caption || ""}</p>

        <div class="social-row">
          <button class="like-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${b.id}', ${liked})">
            ${liked ? '♥ Liked' : '♡ Like'} ${count > 0 ? `(${count})` : ''}
          </button>
          ${count > 0 ? `<button class="secondary" onclick="toggleLikersList('${b.id}')">See who liked</button>` : ''}
        </div>
        <div id="likers-list-${b.id}" class="comment-row" style="display:none; color:var(--ink-soft);">
          Liked by ${(likersByBracelet[b.id] || []).join(", ")}
        </div>

        <div class="comments-list">
          ${comments.map(c => `
            <div class="comment-row"><strong>${c.profiles.username}:</strong> ${c.comment}</div>
          `).join("") || "<p style='color:var(--ink-soft); font-size:0.85rem;'>No comments yet.</p>"}
        </div>

        <div class="comment-form">
          <input type="text" id="comment-input-${b.id}" placeholder="Add a comment...">
          <button onclick="submitComment('${b.id}')">Post</button>
        </div>
      </div>
    `;
  }

  async function toggleLike(braceletId, currentlyLiked) {
    if (currentlyLiked) {
      await supabase.from("bracelet_likes")
        .delete()
        .eq("bracelet_id", braceletId)
        .eq("user_id", currentUser.id);
    } else {
      await supabase.from("bracelet_likes")
        .insert({ bracelet_id: braceletId, user_id: currentUser.id });
    }
    loadFriendFeed(); // reload so the count and heart update
  }

  // Shows/hides the "Liked by ..." line under a post
  function toggleLikersList(braceletId) {
    const el = document.getElementById(`likers-list-${braceletId}`);
    el.style.display = el.style.display === "none" ? "block" : "none";
  }

  async function submitComment(braceletId) {
    const input = document.getElementById(`comment-input-${braceletId}`);
    const text = input.value.trim();
    if (!text) return;

    const { error } = await supabase.from("bracelet_comments").insert({
      bracelet_id: braceletId,
      user_id: currentUser.id,
      comment: text
    });

    if (error) { alert(error.message); return; }
    input.value = "";
    loadFriendFeed();
  }

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = "index.html";
  }

  init();
</script>

</body>
</html>
