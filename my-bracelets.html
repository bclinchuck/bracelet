<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bracelet Buddies — My Bracelets</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<!-- Converts iPhone HEIC photos to JPEG right in the browser before upload,
     since no browser can display HEIC directly. -->
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body>

<nav>
  <a href="dashboard.html">Home</a>
  <a href="tutorials.html">Tutorials</a>
  <a href="my-bracelets.html">My Bracelets</a>
  <a href="friends.html">Friends</a>
  <span class="spacer"></span>
  <a href="#" onclick="logout()" style="color:white;">Log Out</a>
</nav>

<main>
  <h1>My Bracelets</h1>

  <div class="card">
    <h2>Share a Photo</h2>
    <input type="file" id="photo-input" accept="image/*">
    <textarea id="caption-input" placeholder="Caption (optional)"></textarea>
    <button onclick="uploadBracelet()">Upload</button>
    <p class="error-msg" id="upload-error"></p>
  </div>

  <h2>My Gallery</h2>
  <div id="bracelet-list">Loading...</div>
</main>

<script>
  let currentUser;

  async function init() {
    currentUser = await requireLogin();
    if (!currentUser) return;
    loadBracelets();
  }

  async function uploadBracelet() {
    const fileInput = document.getElementById("photo-input");
    const errorMsg = document.getElementById("upload-error");
    errorMsg.textContent = "";

    let file = fileInput.files[0];
    if (!file) { errorMsg.textContent = "Please choose a photo."; return; }

    // iPhones often save photos as HEIC, which no browser can display as
    // an <img>. Detect that (by file type OR the .heic/.heif extension,
    // since some browsers don't report a MIME type for HEIC files) and
    // convert it to a normal JPEG before doing anything else.
    const isHeic = file.type === "image/heic" || file.type === "image/heif" ||
                   /\.hei[cf]$/i.test(file.name);

    if (isHeic) {
      errorMsg.textContent = "Converting photo…";
      try {
        const convertedBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.85 });
        // Rebuild a File object (heic2any returns a plain Blob) so the rest
        // of the upload code can keep treating it like a normal file.
        const newName = file.name.replace(/\.hei[cf]$/i, ".jpg");
        file = new File([convertedBlob], newName, { type: "image/jpeg" });
      } catch (err) {
        errorMsg.textContent = "Couldn't convert this HEIC photo: " + err.message;
        return;
      }
      errorMsg.textContent = "";
    }

    // Supabase Storage rejects spaces and some punctuation in file paths,
    // and screenshots/photos often have names like "Screenshot 2026-09-11
    // at 2.31.18 PM.png". Strip anything that isn't a letter, number, dot,
    // or hyphen so the upload never fails because of the filename.
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-]/g, "_");
    const filePath = `${currentUser.id}/${Date.now()}-${safeName}`;

    // IMPORTANT: pass contentType explicitly — without it, Supabase Storage
    // defaults to saving the file as text/plain, and browsers then refuse
    // to render it as an image even though the photo data itself is fine.
    const { error: uploadError } = await supabase.storage
      .from("bracelet-photos")
      .upload(filePath, file, { contentType: file.type });

    if (uploadError) { errorMsg.textContent = uploadError.message; return; }

    // Get the public URL for the file we just uploaded
    const { data: urlData } = supabase.storage
      .from("bracelet-photos")
      .getPublicUrl(filePath);

    const { error: insertError } = await supabase.from("bracelets").insert({
      user_id: currentUser.id,
      photo_url: urlData.publicUrl,
      caption: document.getElementById("caption-input").value.trim()
    });

    if (insertError) { errorMsg.textContent = insertError.message; return; }

    fileInput.value = "";
    document.getElementById("caption-input").value = "";
    loadBracelets();
  }

  async function loadBracelets() {
    const listDiv = document.getElementById("bracelet-list");

    const { data: bracelets } = await supabase
      .from("bracelets")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", { ascending: false });

    if (!bracelets || bracelets.length === 0) {
      listDiv.innerHTML = "<p>You haven't posted any bracelets yet.</p>";
      return;
    }

    await loadSocialData(bracelets.map(b => b.id));

    listDiv.innerHTML = bracelets.map(b => {
      const count = likeCounts[b.id] || 0;
      const comments = commentsByBracelet[b.id] || [];
      return `
        <div class="card">
          <img src="${b.photo_url}" alt="bracelet photo">
          <p>${b.caption || ""}</p>

          <div class="social-row">
            <span>${count > 0 ? `♥ ${count} like${count === 1 ? '' : 's'}` : 'No likes yet'}</span>
          </div>

          <div class="comments-list">
            ${comments.map(c => `
              <div class="comment-row"><strong>${c.profiles.username}:</strong> ${c.comment}</div>
            `).join("") || "<p style='color:var(--ink-soft); font-size:0.85rem;'>No comments yet.</p>"}
          </div>

          <button class="secondary" onclick="deleteBracelet('${b.id}')">Delete</button>
        </div>
      `;
    }).join("");
  }

  // ---- Likes and comments (read-only display here — liking/commenting
  // on your own photos happens from friends viewing the dashboard feed) ----
  let likeCounts = {};
  let commentsByBracelet = {};

  async function loadSocialData(braceletIds) {
    const { data: likes } = await supabase
      .from("bracelet_likes")
      .select("bracelet_id")
      .in("bracelet_id", braceletIds);

    likeCounts = {};
    (likes || []).forEach(like => {
      likeCounts[like.bracelet_id] = (likeCounts[like.bracelet_id] || 0) + 1;
    });

    const { data: comments } = await supabase
      .from("bracelet_comments")
      .select("*, profiles(username)")
      .in("bracelet_id", braceletIds)
      .order("created_at", { ascending: true });

    commentsByBracelet = {};
    (comments || []).forEach(c => {
      if (!commentsByBracelet[c.bracelet_id]) commentsByBracelet[c.bracelet_id] = [];
      commentsByBracelet[c.bracelet_id].push(c);
    });
  }

  async function deleteBracelet(id) {
    if (!confirm("Delete this photo?")) return;
    const { error } = await supabase.from("bracelets").delete().eq("id", id);
    if (error) { alert(error.message); return; }
    loadBracelets();
  }

  async function logout() {
    await supabase.auth.signOut();
    window.location.href = "login.html";
  }

  init();
</script>

</body>
</html>
